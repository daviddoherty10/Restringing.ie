name: Deployment CI

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/deployment.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/deployment.yml'

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_FILE: deploy/compose.yml
      COMPOSE_PROJECT_NAME: restringing-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure isolated test environment
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/.env.example deploy/.env
          password="$(openssl rand -hex 24)"
          sed -i "s/replace_with_random_url_safe_password/$password/g" deploy/.env

      - name: Validate Compose configuration
        run: docker compose --project-directory . --env-file deploy/.env -f "$COMPOSE_FILE" config --quiet

      - name: Build all application images
        run: docker compose --project-directory . --env-file deploy/.env -f "$COMPOSE_FILE" build --pull

      - name: Start stack and run migrations
        run: docker compose --project-directory . --env-file deploy/.env -f "$COMPOSE_FILE" up -d --wait --wait-timeout 180

      - name: Smoke test preview and landing routes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health > /tmp/api-health.json; then
              break
            fi
            sleep 2
          done
          grep -q '"status":"ok"' /tmp/api-health.json
          curl --fail --silent --show-error http://127.0.0.1:8080/ -o /tmp/preview.html
          grep -qi '<html' /tmp/preview.html
          curl --fail --silent --show-error http://127.0.0.1:8082/ -o /tmp/landing.html
          grep -q 'Your next restring' /tmp/landing.html
          curl --silent --show-error http://127.0.0.1:8082/api/v1/health -o /tmp/landing-api-response
          if grep -q '"status":"ok"' /tmp/landing-api-response; then
            echo 'The landing service unexpectedly exposes the API health route.'
            exit 1
          fi

      - name: Print diagnostics on failure
        if: failure()
        run: |
          docker compose --project-directory . --env-file deploy/.env -f "$COMPOSE_FILE" ps -a || true
          docker compose --project-directory . --env-file deploy/.env -f "$COMPOSE_FILE" logs --no-color --tail 200 || true

      - name: Tear down isolated test stack
        if: always()
        run: docker compose --project-directory . --env-file deploy/.env -f "$COMPOSE_FILE" down --volumes --remove-orphans || true
