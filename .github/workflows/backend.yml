name: Backend
on:
  pull_request:
    paths: ['backend/**', 'api/**', 'frontend/src/lib/marketplace*', '.github/workflows/backend.yml']
  push:
    branches: [main]
    paths: ['backend/**', 'api/**', 'frontend/src/lib/marketplace*', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: marketplace_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d marketplace_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/marketplace_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formatting, vet, build and race tests
        working-directory: backend
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go build ./...
          go run ./cmd/openapi > /tmp/openapi.json
          cmp /tmp/openapi.json ../api/openapi.json
          go test -race -count=1 ./...
      - name: Goose migration round trip (disposable database)
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@v3.26.0
          goose -dir backend/migrations postgres "$TEST_DATABASE_URL" up
          goose -dir backend/migrations postgres "$TEST_DATABASE_URL" down-to 0
          goose -dir backend/migrations postgres "$TEST_DATABASE_URL" up
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend contract types, lint and build
        working-directory: frontend
        run: |
          npm ci
          npx --yes openapi-typescript@7.13.0 ../api/openapi.json -o /tmp/marketplace-contract.d.ts
          cmp /tmp/marketplace-contract.d.ts src/lib/marketplace-contract.d.ts
          npm run lint
          npm run build
