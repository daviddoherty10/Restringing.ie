name: Publish deployment images (AMD64 and ARM64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/landing/**'
      - '.github/workflows/publish-arm64.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: ${{ matrix.service }} / ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            arch: amd64
            runner: ubuntu-24.04
            context: ./backend
            file: ./backend/Dockerfile
            target: api
          - service: migrate
            arch: amd64
            runner: ubuntu-24.04
            context: ./backend
            file: ./backend/Dockerfile
            target: migrate
          - service: web
            arch: amd64
            runner: ubuntu-24.04
            context: ./frontend
            file: ./frontend/Dockerfile
            target: web
          - service: landing
            arch: amd64
            runner: ubuntu-24.04
            context: ./deploy/landing
            file: ./deploy/landing/Dockerfile
            target: ''
          - service: api
            arch: arm64
            runner: ubuntu-24.04-arm
            context: ./backend
            file: ./backend/Dockerfile
            target: api
          - service: migrate
            arch: arm64
            runner: ubuntu-24.04-arm
            context: ./backend
            file: ./backend/Dockerfile
            target: migrate
          - service: web
            arch: arm64
            runner: ubuntu-24.04-arm
            context: ./frontend
            file: ./frontend/Dockerfile
            target: web
          - service: landing
            arch: arm64
            runner: ubuntu-24.04-arm
            context: ./deploy/landing
            file: ./deploy/landing/Dockerfile
            target: ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish native image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/daviddoherty10/restringing-ie-${{ matrix.service }}:main-${{ matrix.arch }}
            ghcr.io/daviddoherty10/restringing-ie-${{ matrix.service }}:${{ github.sha }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/daviddoherty10/Restringing.ie
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}
