name: Publish ARM64 deployment images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'deploy/landing/**'
      - '.github/workflows/publish-arm64.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./backend
            file: ./backend/Dockerfile
            target: api
          - service: migrate
            context: ./backend
            file: ./backend/Dockerfile
            target: migrate
          - service: web
            context: ./frontend
            file: ./frontend/Dockerfile
            target: web
          - service: landing
            context: ./deploy/landing
            file: ./deploy/landing/Dockerfile
            target: ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish native ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/daviddoherty10/restringing-ie-${{ matrix.service }}:main-arm64
            ghcr.io/daviddoherty10/restringing-ie-${{ matrix.service }}:${{ github.sha }}-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/daviddoherty10/Restringing.ie
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-arm64
