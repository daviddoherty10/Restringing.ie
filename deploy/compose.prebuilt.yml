# Coolify production-like preview: pull native ARM64 images from GHCR rather than
# compiling Go/Node on the Hetzner VPS. Use after the publish-arm64 workflow succeeds.
# Select this file as Coolify's Compose Location: /deploy/compose.prebuilt.yml.
# Set IMAGE_TAG=main-arm64, or a verified commit-specific SHA followed by -arm64.
name: restringing
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  migrate:
    image: ghcr.io/daviddoherty10/restringing-ie-migrate:${IMAGE_TAG:-main-arm64}
    pull_policy: always
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL:?Set DATABASE_URL}
      GOOSE_MIGRATION_DIR: /migrations
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [private]

  api:
    image: ghcr.io/daviddoherty10/restringing-ie-api:${IMAGE_TAG:-main-arm64}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      API_ADDR: ":8081"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}
      AUTH_SMS_PROVIDER: ${AUTH_SMS_PROVIDER:-}
      AUTH_RATE_LIMIT_KEY: ${AUTH_RATE_LIMIT_KEY:-}
      AUTH_ALLOWED_CALLING_CODES: ${AUTH_ALLOWED_CALLING_CODES:-+353,+44}
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_MONTHLY_PRICE_ID: ${STRIPE_MONTHLY_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]

  web:
    image: ghcr.io/daviddoherty10/restringing-ie-web:${IMAGE_TAG:-main-arm64}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks: [private]

  landing:
    image: ghcr.io/daviddoherty10/restringing-ie-landing:${IMAGE_TAG:-main-arm64}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${LANDING_BIND:-127.0.0.1}:${LANDING_PORT:-8082}:80"
    networks: [private]

networks:
  private:

volumes:
  postgres_data:
