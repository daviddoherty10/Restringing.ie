# Portable Coolify/VPS deployment: preview app + public coming-soon site.
# Run: docker compose --env-file deploy/.env -f deploy/compose.yml up -d --build
name: restringing
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL:?Set DATABASE_URL}
      GOOSE_MIGRATION_DIR: /migrations
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [private]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      API_ADDR: ":8081"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}
      AUTH_SMS_PROVIDER: ${AUTH_SMS_PROVIDER:-}
      AUTH_RATE_LIMIT_KEY: ${AUTH_RATE_LIMIT_KEY:-}
      AUTH_ALLOWED_CALLING_CODES: ${AUTH_ALLOWED_CALLING_CODES:-+353,+44}
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_MONTHLY_PRICE_ID: ${STRIPE_MONTHLY_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks: [private]

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${LANDING_BIND:-127.0.0.1}:${LANDING_PORT:-8082}:80"
    networks: [private]

networks:
  private:

volumes:
  postgres_data:
